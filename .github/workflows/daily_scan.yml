# Runs the scanner every weekday after the Indian market closes and saves the results to data/.
# 11:30 UTC = 5:00 PM IST. You can also start it by hand: Actions tab -> Daily scan -> Run workflow.
name: Daily scan

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas numpy requests

      - name: Run the scan
        run: python build_data.py

      - name: Save the results to the repository
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update scan data"
          git push
